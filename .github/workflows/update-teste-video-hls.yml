name: Atualizar HLS do vídeo (teste-video-hls)

on:
  schedule:
    - cron: "*/5 * * * *" # a cada 5 minutos, 24h por dia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install yt-dlp

      - name: Rodar o script
        run: python3 teste-video-hls/scripts/fetch_live_hls.py

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "mural-alfa-bot"
          git config user.email "actions@github.com"
          git add teste-video-hls/data/youtube-live-hls.json
          git diff --cached --quiet || git commit -m "Atualiza HLS do vídeo (teste)"
          git push
